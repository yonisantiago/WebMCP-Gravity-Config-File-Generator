<!DOCTYPE html>
<html lang="en">
<head>
<script src="script.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebMCP Config Generator</title>
<style>
  :root{
    --bg: #16171a;
    --panel: #1c1e22;
    --panel-raised: #232529;
    --border: #2e3137;
    --text: #d9dce1;
    --text-dim: #868b94;
    --text-faint: #565b64;
    --accent: #e3b341;
    --accent-dim: #6b5a2a;
    --ok: #7ee787;
    --skip: #565b64;
    --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Inter", "Segoe UI", sans-serif;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
  }
  .app{
    display:flex;
    flex-direction:column;
    height:100vh;
  }
  header{
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    display:flex;
    align-items:baseline;
    gap: 14px;
    flex-shrink:0;
  }
  header h1{
    font-size: 15px;
    font-weight: 600;
    margin:0;
    letter-spacing: 0.01em;
  }
  header .sub{
    color: var(--text-dim);
    font-size: 13px;
  }
  .layout{
    flex:1;
    display:flex;
    min-height:0;
  }
  .col-left{
    width: 46%;
    border-right: 1px solid var(--border);
    display:flex;
    flex-direction:column;
    min-width: 380px;
  }
  .col-right{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width: 0;
  }
  .col-header{
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    text-transform: none;
    color: var(--text-dim);
    display:flex;
    justify-content: space-between;
    align-items:center;
    flex-shrink:0;
  }
  .col-body{
    flex:1;
    overflow-y:auto;
    padding: 20px;
  }

  /* Dropzone */
  .dropzone{
    border: 1px dashed var(--border);
    border-radius: 6px;
    padding: 36px 20px;
    text-align:center;
    color: var(--text-dim);
    cursor:pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .dropzone:hover, .dropzone.drag{
    border-color: var(--accent);
    background: rgba(227,179,65,0.04);
  }
  .dropzone strong{ color: var(--text); font-weight: 500; }
  .dropzone input{ display:none; }
  .dropzone .hint{ font-size:12px; color: var(--text-faint); margin-top:6px; }

  .file-loaded{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 10px 14px;
    background: var(--panel-raised);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 12.5px;
    margin-bottom: 18px;
  }
  .file-loaded button{
    background:none;
    border:none;
    color: var(--text-dim);
    cursor:pointer;
    font-family: var(--sans);
    font-size: 12px;
    text-decoration: underline;
  }
  .file-loaded button:hover{ color: var(--text); }

  /* Form cards */
  .form-card{
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 14px;
    background: var(--panel);
    overflow: hidden;
  }
  .form-card-head{
    display:flex;
    align-items:center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--panel-raised);
    cursor:pointer;
    user-select:none;
  }
  .form-card-head .id-badge{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--bg);
    background: var(--text-dim);
    padding: 1px 6px;
    border-radius: 3px;
    flex-shrink:0;
  }
  .form-card-head .title{
    flex:1;
    font-size: 13px;
    color: var(--text);
    white-space: nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .form-card-head .chev{
    color: var(--text-faint);
    font-size: 11px;
    transition: transform .15s ease;
  }
  .form-card.collapsed .chev{ transform: rotate(-90deg); }
  .form-card.collapsed .form-card-body{ display:none; }
  .form-card-head input[type=checkbox]{ accent-color: var(--accent); }

  .form-card-body{ padding: 14px; }
  .field-row{
    display:grid;
    grid-template-columns: 20px 90px 1fr;
    gap: 10px;
    align-items:center;
    margin-bottom: 6px;
    font-size: 12.5px;
  }
  .field-row.skipped{ opacity: 0.4; }
  .field-row .key{
    font-family: var(--mono);
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .field-row input[type=checkbox]{ accent-color: var(--accent); }
  .field-row input[type=text]{
    width:100%;
    background: var(--panel-raised);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    padding: 5px 8px;
    font-family: var(--sans);
    font-size: 12.5px;
  }
  .field-row input[type=text]:focus{ outline: none; border-color: var(--accent); }

  label.meta-label{
    display:block;
    font-size: 11px;
    color: var(--text-faint);
    margin: 10px 0 4px;
  }
  input.meta-input, textarea.meta-input{
    width:100%;
    background: var(--panel-raised);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    padding: 7px 9px;
    font-family: var(--mono);
    font-size: 12.5px;
  }
  textarea.meta-input{ resize: vertical; min-height: 44px; }
  input.meta-input:focus, textarea.meta-input:focus{ outline:none; border-color: var(--accent); }

  .empty-state{
    color: var(--text-faint);
    font-size: 13px;
    padding: 40px 10px;
    text-align:center;
  }

  /* Output pane */
  pre#output{
    margin:0;
    padding: 20px;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.6;
    white-space: pre;
    overflow: auto;
    height: 100%;
    color: var(--text);
  }
  .tok-comment{ color: var(--text-faint); }
  .tok-key{ color: var(--ok); }
  .tok-string{ color: var(--accent); }
  .tok-punct{ color: var(--text-dim); }

  .toolbar-actions{ display:flex; gap: 8px; }
  .btn{
    background: var(--panel-raised);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--sans);
    font-size: 12px;
    padding: 5px 11px;
    border-radius: 5px;
    cursor:pointer;
  }
  .btn:hover{ border-color: var(--text-dim); }
  .btn.primary{
    background: var(--accent);
    border-color: var(--accent);
    color: #1c1600;
    font-weight: 600;
  }
  .btn.primary:hover{ background: #edc665; }
  .btn:disabled{ opacity: 0.4; cursor: not-allowed; }
  .btn.copied{ color: var(--ok); border-color: var(--ok); background:none; }

  .todo-count{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>WebMCP Config Generator</h1>
    <span class="sub">GravityForms export → webmcp-gravityforms-config.php</span>
  </header>

  <div class="layout">
    <div class="col-left">
      <div class="col-header"><span>Source &amp; forms</span></div>
      <div class="col-body" id="leftBody">
        <div class="dropzone" id="dropzone">
          <div><strong>Drop a GravityForms export</strong> or click to choose a file</div>
          <div class="hint">Forms → Import/Export → Export Forms → .json</div>
          <input type="file" id="fileInput" accept=".json,application/json">
        </div>
        <div id="formsList"></div>
      </div>
    </div>

    <div class="col-right">
      <div class="col-header">
        <span id="outputSummary">Generated config</span>
        <div class="toolbar-actions">
          <span class="todo-count" id="todoCount"></span>
          <button class="btn" id="copyBtn" disabled>Copy</button>
          <button class="btn primary" id="downloadBtn" disabled>Download .php</button>
        </div>
      </div>
      <pre id="output"><span class="tok-comment">// Upload a GravityForms JSON export on the left to generate a config file here.</span></pre>
    </div>
  </div>
</div>
<script>

(function(){
  "use strict";

  const SKIP_FIELD_TYPES = new Set(['hidden','uid','captcha','consent','checkbox','html','page','section','save']);

  let state = { forms: [] }; // [{id, title, include, toolname, tooldescription, fields:[{key, label, include}]}]

  // ---------- parsing / generation logic (mirrors the PHP/CLI version) ----------

  function cleanLabel(label){
    if(!label) return '';
    const div = document.createElement('div');
    div.innerHTML = label;
    let text = div.textContent || div.innerText || '';
    text = text.replace(/\s+/g,' ').trim();
    return text;
  }

  function generateToolName(title){
    let suffixWords = [];
    let base = title;
    const m = title.match(/\(([^)]+)\)/);
    if(m){
      suffixWords = m[1].match(/[A-Za-z0-9]+/g) || [];
      base = title.replace(m[0], '');
    }
    const words = (base.match(/[A-Za-z0-9]+/g) || []).concat(suffixWords);
    let camel = 'submit';
    for(const w of words){
      camel += w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
    }
    return camel;
  }

  function generateToolDescription(title){
    return `Submit the "${title}" form and we will get back to you shortly. TODO: review this description.`;
  }

  function extractForms(data){
    const forms = [];
    const entries = Array.isArray(data) ? data : Object.values(data || {});
    for(const entry of entries){
      if(entry && typeof entry === 'object' && 'id' in entry && Array.isArray(entry.fields)){
        forms.push(entry);
      }
    }
    forms.sort((a,b) => a.id - b.id);
    return forms;
  }

  function buildFieldsList(formFields){
    const fields = [];
    const seen = new Set();
    for(const field of formFields){
      const type = field.type || '';
      const skippedByType = SKIP_FIELD_TYPES.has(type);
      if(field.inputs && Array.isArray(field.inputs) && field.inputs.length){
        for(const sub of field.inputs){
          const subId = String(sub.id).replace('.', '_');
          const key = `input_${subId}`;
          if(seen.has(key)) continue;
          seen.add(key);
          fields.push({
            key,
            label: cleanLabel(sub.label || field.label || ''),
            include: !skippedByType
          });
        }
      } else {
        if(field.id === undefined || field.id === null) continue;
        const key = `input_${field.id}`;
        if(seen.has(key)) continue;
        seen.add(key);
        fields.push({
          key,
          label: cleanLabel(field.label || ''),
          include: !skippedByType
        });
      }
    }
    return fields;
  }

  function phpStringLiteral(value){
    const escaped = String(value).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    return `'${escaped}'`;
  }

  // ---------- rendering left panel (editable review UI) ----------

  function renderFormsList(){
    const container = document.getElementById('formsList');
    container.innerHTML = '';
    if(!state.forms.length){
      return;
    }
    state.forms.forEach((form, fi) => {
      const card = document.createElement('div');
      card.className = 'form-card';

      const head = document.createElement('div');
      head.className = 'form-card-head';
      head.innerHTML = `
        <input type="checkbox" ${form.include ? 'checked':''} data-role="form-include">
        <span class="id-badge">#${form.id}</span>
        <span class="title">${form.title}</span>
        <span class="chev">▾</span>
      `;
      head.querySelector('[data-role="form-include"]').addEventListener('click', e => e.stopPropagation());
      head.querySelector('[data-role="form-include"]').addEventListener('change', e => {
        form.include = e.target.checked;
        regenerate();
      });
      head.addEventListener('click', () => {
        card.classList.toggle('collapsed');
      });

      const body = document.createElement('div');
      body.className = 'form-card-body';

      const toolLabel = document.createElement('label');
      toolLabel.className = 'meta-label';
      toolLabel.textContent = 'toolname';
      const toolInput = document.createElement('input');
      toolInput.className = 'meta-input';
      toolInput.type = 'text';
      toolInput.value = form.toolname;
      toolInput.addEventListener('input', e => { form.toolname = e.target.value; regenerate(); });

      const descLabel = document.createElement('label');
      descLabel.className = 'meta-label';
      descLabel.textContent = 'tooldescription';
      const descInput = document.createElement('textarea');
      descInput.className = 'meta-input';
      descInput.value = form.tooldescription;
      descInput.addEventListener('input', e => { form.tooldescription = e.target.value; regenerate(); });

      const fieldsLabel = document.createElement('label');
      fieldsLabel.className = 'meta-label';
      fieldsLabel.textContent = `fields (${form.fields.filter(f=>f.include).length}/${form.fields.length} included)`;

      body.appendChild(toolLabel);
      body.appendChild(toolInput);
      body.appendChild(descLabel);
      body.appendChild(descInput);
      body.appendChild(fieldsLabel);

      form.fields.forEach((field, fieldi) => {
        const row = document.createElement('div');
        row.className = 'field-row' + (field.include ? '' : ' skipped');

        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = field.include;
        cb.addEventListener('change', e => {
          field.include = e.target.checked;
          row.classList.toggle('skipped', !field.include);
          regenerate();
        });

        const key = document.createElement('span');
        key.className = 'key';
        key.textContent = field.key;

        const labelInput = document.createElement('input');
        labelInput.type = 'text';
        labelInput.value = field.label;
        labelInput.addEventListener('input', e => {
          field.label = e.target.value;
          regenerate();
        });

        row.appendChild(cb);
        row.appendChild(key);
        row.appendChild(labelInput);
        body.appendChild(row);
      });

      card.appendChild(head);
      card.appendChild(body);
      container.appendChild(card);
    });
  }

  // ---------- output rendering ----------

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function buildPhp(){
    const included = state.forms.filter(f => f.include);
    let out = "<?php\n";
    out += "/**\n";
    out += " * WebMCP GravityForms Configuration\n";
    out += " *\n";
    out += " * Generated with the WebMCP Config Generator — review before shipping!\n";
    out += " * Generated: " + new Date().toISOString() + "\n";
    out += " *\n";
    out += " * @package WebMCP\n";
    out += " * @subpackage GravityForms\n";
    out += " * @since 1.0.0\n";
    out += " */\n\n";
    out += "// Exit if accessed directly\n";
    out += "if ( ! defined( 'ABSPATH' ) ) {\n\texit;\n}\n\n";
    out += "return [\n";

    included.forEach(form => {
      const fields = form.fields.filter(f => f.include);
      out += `\t// Form ID ${form.id} - ${form.title}\n`;
      out += `\t${form.id} => [\n`;
      out += `\t\t'toolname'        => ${phpStringLiteral(form.toolname)},\n`;
      out += `\t\t'tooldescription' => ${phpStringLiteral(form.tooldescription)},\n`;
      out += `\t\t'fields'          => [\n`;
      fields.forEach(f => {
        out += `\t\t\t'${f.key}' => ${phpStringLiteral(f.label.endsWith('.') ? f.label : f.label + '.')},\n`;
      });
      out += `\t\t],\n`;
      out += `\t],\n\n`;
    });

    out += "];\n";
    return out;
  }

  function highlight(php){
    const lines = php.split('\n').map(line => {
      let esc = escapeHtml(line);
      if(/^\s*(\/\/|\*|\/\*)/.test(line)){
        return `<span class="tok-comment">${esc}</span>`;
      }
      esc = esc.replace(/(&#039;(?:[^&]|&(?!#039;))*?&#039;|'(?:[^'\\]|\\.)*')/g, m => `<span class="tok-string">${m}</span>`);
      return esc;
    });
    return lines.join('\n');
  }

  function regenerate(){
    const output = document.getElementById('output');
    const copyBtn = document.getElementById('copyBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const todoCount = document.getElementById('todoCount');

    if(!state.forms.length){
      output.innerHTML = '<span class="tok-comment">// Upload a GravityForms JSON export on the left to generate a config file here.</span>';
      copyBtn.disabled = true;
      downloadBtn.disabled = true;
      todoCount.textContent = '';
      return;
    }

    const php = buildPhp();
    output.innerHTML = highlight(php);
    copyBtn.disabled = false;
    downloadBtn.disabled = false;
    state.currentPhp = php;

    const todos = (php.match(/TODO:/g) || []).length;
    todoCount.textContent = todos ? `${todos} description${todos===1?'':'s'} need review` : '';
  }

  // ---------- file loading ----------

  function loadFile(file){
    const reader = new FileReader();
    reader.onload = e => {
      let data;
      try{
        data = JSON.parse(e.target.result);
      } catch(err){
        alert('That file is not valid JSON: ' + err.message);
        return;
      }
      const rawForms = extractForms(data);
      if(!rawForms.length){
        alert('No forms found in this export.');
        return;
      }
      state.forms = rawForms.map(form => ({
        id: form.id,
        title: form.title || `Form ${form.id}`,
        include: true,
        toolname: generateToolName(form.title || `Form ${form.id}`),
        tooldescription: generateToolDescription(form.title || `Form ${form.id}`),
        fields: buildFieldsList(form.fields)
      }));

      const leftBody = document.getElementById('leftBody');
      let loaded = document.getElementById('fileLoadedBanner');
      if(!loaded){
        loaded = document.createElement('div');
        loaded.id = 'fileLoadedBanner';
        loaded.className = 'file-loaded';
        leftBody.insertBefore(loaded, leftBody.firstChild);
      }
      loaded.innerHTML = `<span>${file.name} — ${state.forms.length} form${state.forms.length===1?'':'s'} found</span><button id="clearBtn">clear</button>`;
      loaded.querySelector('#clearBtn').addEventListener('click', () => {
        state.forms = [];
        loaded.remove();
        document.getElementById('dropzone').style.display = '';
        renderFormsList();
        regenerate();
      });

      document.getElementById('dropzone').style.display = 'none';
      renderFormsList();
      regenerate();
    };
    reader.readAsText(file);
  }

  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');

  dropzone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => {
    if(e.target.files[0]) loadFile(e.target.files[0]);
  });
  ['dragenter','dragover'].forEach(evt => {
    dropzone.addEventListener(evt, e => {
      e.preventDefault();
      dropzone.classList.add('drag');
    });
  });
  ['dragleave','drop'].forEach(evt => {
    dropzone.addEventListener(evt, e => {
      e.preventDefault();
      dropzone.classList.remove('drag');
    });
  });
  dropzone.addEventListener('drop', e => {
    const file = e.dataTransfer.files[0];
    if(file) loadFile(file);
  });

  document.getElementById('copyBtn').addEventListener('click', () => {
    if(!state.currentPhp) return;
    navigator.clipboard.writeText(state.currentPhp).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = 'Copied';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1400);
    });
  });

  document.getElementById('downloadBtn').addEventListener('click', () => {
    if(!state.currentPhp) return;
    const blob = new Blob([state.currentPhp], {type: 'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'webmcp-gravityforms-config.php';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

})();

</script>
</body>
</html>
